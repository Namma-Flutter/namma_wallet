version: 2

updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      flutter-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "flutter"
    cooldown:
      default-days: 7

  - package-ecosystem: "bundler"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      android-bundler:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ruby"
    cooldown:
      default-days: 7

  - package-ecosystem: "bundler"
    directory: "/ios"
    schedule:
      interval: "weekly"
    groups:
      ios-bundler:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ruby"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7
