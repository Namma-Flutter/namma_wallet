name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          VERSION=$(grep '^  flutter:' pubspec.yaml | awk -F'"' '{print $2}')
          echo "flutter_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check dart format
        id: format_check
        run: |
          set +e
          dart format --set-exit-if-changed .
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: Run flutter analyze (write log)
        if: ${{ steps.format_check.outputs.exit_code == '0' }}
        run: flutter analyze --write=flutter_analyze.log

      - name: Prepare PR comments
        if: always()
        run: |
          mkdir -p pr-comments
          echo "${{ github.event.pull_request.number }}" > pr-comments/pr_number

          if [ "${{ steps.format_check.outputs.exit_code }}" != "0" ]; then
            cat << 'EOF' > pr-comments/format_comment.txt
          ❌ **Formatting check failed**
          Please run:
          ```bash
          fvm dart format .
          ```
          or
          ```bash
          dart format .
          ```
          Then push the updated files.
          EOF
          else
            echo "DELETE" > pr-comments/format_comment.txt
          fi

          if [ "${{ steps.format_check.outputs.exit_code }}" == "0" ]; then
            if [ -f flutter_analyze.log ] && [ -s flutter_analyze.log ]; then
              content=$(cat flutter_analyze.log)
              {
                echo "❌ **Flutter analysis found issues:**"
                echo '```'
                echo "$content"
                echo '```'
              } > pr-comments/analyze_comment.txt
            else
              echo "✅ **Flutter analysis passed** — no issues found." > pr-comments/analyze_comment.txt
            fi
          fi

      - name: Upload PR comments artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comments-format-analyze
          path: pr-comments/

      - name: Check format results
        if: always()
        run: |
          if [ "${{ steps.format_check.outputs.exit_code }}" != "0" ]; then
            echo "Formatting check failed with exit code ${{ steps.format_check.outputs.exit_code }}"
            exit 1
          fi

  test-coverage:
    needs: format-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Read Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          VERSION=$(grep '^  flutter:' pubspec.yaml | awk -F'"' '{print $2}')
          echo "flutter_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        id: test_run
        run: |
          set +e
          set -o pipefail
          flutter test --coverage 2>&1 | tee test_output.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: Prepare PR comments
        if: always()
        run: |
          mkdir -p pr-comments
          echo "${{ github.event.pull_request.number }}" > pr-comments/pr_number

          if [ "${{ steps.test_run.outputs.exit_code }}" != "0" ]; then
            if [ -f test_output.log ]; then
              FAILURES=$(grep -A 50 "Some tests failed" test_output.log || grep -A 50 "FAILED" test_output.log || tail -n 30 test_output.log)
              if [ ${#FAILURES} -gt 4500 ]; then
                FAILURES="${FAILURES:0:4500}... (truncated)"
              fi
            else
              FAILURES="Could not find test output log"
            fi
            
            {
              echo "❌ **Test run failed**"
              echo ""
              echo "Some tests did not pass. Please review the failures below:"
              echo ""
              echo "```"
              echo "$FAILURES"
              echo "```"
              echo ""
              echo "Please fix the failing tests and push the updated code."
            } > pr-comments/test_comment.txt
          else
            {
              echo "✅ **All tests passed!**"
              echo ""
              echo "The previously failing tests are now fixed."
            } > pr-comments/test_comment.txt
          fi

      - name: Upload PR comments artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comments-coverage
          path: pr-comments/

      - name: Check test results
        if: always()
        run: |
          if [ "${{ steps.test_run.outputs.exit_code }}" != "0" ]; then
            echo "Tests failed with exit code ${{ steps.test_run.outputs.exit_code }}"
            exit 1
          fi

      - name: Install lcov
        if: ${{ steps.test_run.outputs.exit_code == '0' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Convert coverage to lcov format
        if: ${{ steps.test_run.outputs.exit_code == '0' }}
        run: |
          lcov --list-coverage coverage/lcov.info || true

      - name: Upload coverage to Codecov
        if: ${{ steps.test_run.outputs.exit_code == '0' }}
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
