name: Periphery (iOS Dead Code)

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/periphery.yml'
      - '.periphery.yml'
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  periphery-scan:
    name: Periphery Swift Code Scan
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          fi
          xcodebuild -version

      - name: Read Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          VERSION=$(grep '^  flutter:' pubspec.yaml | awk -F'"' '{print $2}')
          echo "flutter_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          rm -f ios/Podfile.lock
          flutter build ios --config-only --no-codesign

      - name: Install Periphery
        run: |
          brew install peripheryapp/periphery/periphery
          periphery version

      - name: Run Periphery Analysis
        run: periphery scan --format github-actions
