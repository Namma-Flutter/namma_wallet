name: SwiftLint

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/swiftlint.yml
      - .swiftlint-version
      - 'ios/**/*.swift'
      - 'ios/**/.swiftlint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read SwiftLint version
        id: swiftlint_version
        run: echo "version=$(cat .swiftlint-version)" >> "$GITHUB_OUTPUT"

      - name: Run SwiftLint
        uses: cirruslabs/swiftlint-action@v1
        with:
          version: ${{ steps.swiftlint_version.outputs.version }}
          args: --strict ios
