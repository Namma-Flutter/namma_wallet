name: Android Build & Size Verification

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-build:
    name: Build Android APK (Smoke & Size)
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # zizmor: ignore[artipacked]

      - name: Check for Android & App Changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/android-smoke-build.yml'

      - name: Fast Pass-Through (Unaffected PR or Bot)
        if: steps.filter.outputs.android != 'true' || github.actor == 'dependabot[bot]'
        run: |
          echo "### ⚡ Fast Pass-Through" >> $GITHUB_STEP_SUMMARY
          echo "No Android changes or bot PR. Skipping APK smoke build." >> $GITHUB_STEP_SUMMARY

      - name: Check for Android & App Changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/android-smoke-build.yml'

      - name: Fast Pass-Through (Unaffected PR or Bot)
        if: steps.filter.outputs.android != 'true' || github.actor == 'dependabot[bot]'
        run: |
          echo "### ⚡ Fast Pass-Through" >> $GITHUB_STEP_SUMMARY
          echo "No Android changes or bot PR. Skipping APK smoke build." >> $GITHUB_STEP_SUMMARY

      - name: Setup Java
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        uses: gradle/actions/setup-gradle@18f1c6724d5bcb313b5c5ef536430a31e5c5b455 # v4.4.0

      - name: Read Flutter version from pubspec.yaml
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        id: flutter_version
        run: |
          VERSION=$(grep '^  flutter:' pubspec.yaml | awk -F'"' '{print $2}')
          echo "flutter_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true

      - name: Install dependencies
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        run: flutter pub get

      - name: Generate code files
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        run: flutter build apk --debug

      - name: Analyze APK Size
        if: steps.filter.outputs.android == 'true' && github.actor != 'dependabot[bot]'
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            APK_BYTES=$(wc -c < "$APK_PATH" | tr -d ' ')
            APK_MB=$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.2f MB", b / (1024 * 1024) }')

            echo "### 📱 Android Smoke Build & Size" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| Build Status | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Debug APK Size | **$APK_MB** ($APK_BYTES bytes) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::APK file not found at $APK_PATH"
            exit 1
          fi
