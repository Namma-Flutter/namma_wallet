name: greenlight

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  greenlight:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for iOS & App Store Changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'pubspec.yaml'
              - '.github/workflows/greenlight.yml'

      - name: Fast Pass-Through (Unaffected PR or Bot)
        if: steps.filter.outputs.ios != 'true' || github.actor == 'dependabot[bot]'
        run: |
          echo "### 🟢 Greenlight Preflight Scan" >> $GITHUB_STEP_SUMMARY
          echo "No iOS changes or bot PR. Greenlight check passed (fast pass-through)." >> $GITHUB_STEP_SUMMARY

      - name: Install Greenlight
        if: steps.filter.outputs.ios == 'true' && github.actor != 'dependabot[bot]'
        run: |
          VERSION="v0.2.0"
          curl -fsSL "https://github.com/RevylAI/greenlight/releases/download/${VERSION}/greenlight_${VERSION#v}_linux_amd64.tar.gz" -o "/tmp/greenlight_${VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/RevylAI/greenlight/releases/download/${VERSION}/checksums.txt" -o /tmp/checksums.txt
          (cd /tmp && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "/tmp/greenlight_${VERSION#v}_linux_amd64.tar.gz" -C /tmp
          sudo mv /tmp/greenlight /usr/local/bin/greenlight
          chmod +x /usr/local/bin/greenlight

      - name: Run preflight scan
        if: steps.filter.outputs.ios == 'true' && github.actor != 'dependabot[bot]'
        id: scan
        run: |
          set +e
          greenlight preflight . --format json --output greenlight-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Parse scan results
        if: steps.filter.outputs.ios == 'true' && github.actor != 'dependabot[bot]'
        id: results
        run: |
          mkdir -p pr-comments
          echo "${{ github.event.pull_request.number }}" > pr-comments/pr_number

          if [ ! -f greenlight-report.json ]; then
            echo "has_blocks=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ **Greenlight report was not generated.** Check the scan step logs." > pr-comments/greenlight_comment.txt
            exit 0
          fi

          passed=$(jq -r '.summary.passed' greenlight-report.json)
          blocks=$(jq -r '.summary.blocks // 0' greenlight-report.json)
          warns=$(jq -r '.summary.warns // 0' greenlight-report.json)
          infos=$(jq -r '.summary.infos // 0' greenlight-report.json)

          echo "has_blocks=$([ "$blocks" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          {
            if [ "$blocks" -gt 0 ]; then
              echo "❌ **Greenlight preflight found $blocks blocking issue(s)**"
            else
              echo "✅ **Greenlight preflight passed** — no blocking issues found."
            fi
            echo ""
            echo "| Severity | Count |"
            echo "| --- | --- |"
            echo "| Blocks | $blocks |"
            echo "| Warns | $warns |"
            echo "| Infos | $infos |"

            if [ "$warns" -gt 0 ]; then
              echo ""
              echo "### Warnings"
              jq -r '
                .findings[]
                | select(.severity | ascii_downcase == "warn")
                | "**\(.title)**  \n\(.detail)" + (if (.fix // "") != "" then "  \n_Fix: \(.fix)_" else "" end)
              ' greenlight-report.json 2>&1
            fi

            if [ "$infos" -gt 0 ]; then
              echo ""
              echo "### Info"
              jq -r '
                .findings[]
                | select(.severity | ascii_downcase == "info")
                | "**\(.title)**  \n\(.detail)" + (if (.fix // "") != "" then "  \n_Fix: \(.fix)_" else "" end)
              ' greenlight-report.json 2>&1
            fi
          } > pr-comments/greenlight_comment.txt

      - name: Prepare placeholder for fast paths
        if: always() && steps.filter.outputs.ios != 'true' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          mkdir -p pr-comments
          echo "${{ github.event.pull_request.number }}" > pr-comments/pr_number
          echo "DELETE" > pr-comments/greenlight_comment.txt

      - name: Upload PR comments artifact
        if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pr-comments-greenlight
          path: pr-comments/

      - name: Print blocking findings
        if: steps.filter.outputs.ios == 'true' && steps.results.outputs.has_blocks == 'true' && github.actor != 'dependabot[bot]'
        run: |
          echo "=== Greenlight Blocking Findings ==="
          jq -r '
            .findings[]
            | select(.severity | ascii_downcase == "block" or ascii_downcase == "critical")
            | "------------------------------------------------------------",
              "Guideline : \(.guideline)",
              "Title     : \(.title)",
              "Detail    : \(.detail)",
              (if (.fix // "") != "" then "Fix       : \(.fix)" else empty end)
          ' greenlight-report.json
          echo "============================================================"
          echo "Fix the above issues before submitting to the App Store."
          exit 1

      - name: Print warn and info findings
        if: always() && steps.filter.outputs.ios == 'true' && github.actor != 'dependabot[bot]'
        run: |
          warns=$(jq -r '.summary.warns // 0' greenlight-report.json 2>/dev/null || echo 0)
          infos=$(jq -r '.summary.infos // 0' greenlight-report.json 2>/dev/null || echo 0)
          if [ "$warns" -gt 0 ] || [ "$infos" -gt 0 ]; then
            echo "=== Greenlight Warn/Info Findings ==="
            jq -r '
              .findings[]
              | select(.severity | ascii_downcase | . == "warn" or . == "info")
              | "------------------------------------------------------------",
                "Severity  : \(.severity)",
                "Guideline : \(.guideline)",
                "Title     : \(.title)",
                "Detail    : \(.detail)",
                (if (.fix // "") != "" then "Fix       : \(.fix)" else empty end)
            ' greenlight-report.json
            echo "============================================================"
          fi
