name: Release Pipeline

# Ships Namma Wallet to the stores and publishes GitHub release artifacts.
#
# Branch semantics (matches the Fastlane 3-stage pipeline):
#   beta    -> build + upload to TestFlight and Play internal track,
#              attach signed APK/IPA to a GitHub pre-release tagged v{version}
#   release -> promote the already-uploaded build to App Store / Play
#              production, attach signed APK/IPA to a stable GitHub release
#
# Prerequisites:
#   * This file must exist on both `beta` and `release` branches —
#     GitHub evaluates workflows from the pushed ref.
#   * Required repository secrets:
#       ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD,
#       ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#       PLAY_STORE_JSON_KEY,
#       APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#       APP_STORE_CONNECT_P8_BASE64
#   * Replaces the old build_and_release.yml on the `release` branch
#     (delete that file when merging).

on:
  pull_request:
    types: [closed]
    branches: [beta, release]
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        type: choice
        options: [beta, release]
        default: beta

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STAGE: ${{ (github.event_name == 'pull_request' && github.base_ref) || inputs.stage }}
  APP_IDENTIFIER: com.nammaflutter.nammawallet
  PACKAGE_NAME: com.nammaflutter.nammawallet

jobs:
  changes:
    name: Detect Changes
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'android/**'
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/**'

  gate:
    name: Analyze & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build
          key: gate-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            gate-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  check-play-store:
    name: Check Play Store Version
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_build: ${{ steps.check.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Decode Play Store service account
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 --decode > play-store-key.json

      - name: Authenticate with service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Check if version exists on Play Store
        id: check
        run: |
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -1 | grep -oP '\d+')
          echo "Version code: $VERSION_CODE"

          ACCESS_TOKEN=$(gcloud auth print-access-token)
          PACKAGE="com.nammaflutter.nammawallet"

          EDIT_ID=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits" \
            -X POST -H "Content-Type: application/json" -d '{}' \
            | jq -r '.id')

          TRACKS=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID/tracks")

          EXISTS=$(echo "$TRACKS" | jq "[.tracks[].releases[].versionCodes[]? | select(. == $VERSION_CODE)] | length > 0")

          curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID" \
            -X DELETE > /dev/null

          if [ "$EXISTS" = "true" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION_CODE already on Play Store. Skipping build."
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION_CODE not found. Will build."
          fi

  android:
    name: Build & Ship Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, gate, check-play-store]
    if: needs.changes.outputs.code == 'true' && needs.check-play-store.outputs.skip_build != 'true'
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_JSON_PATH: ${{ github.workspace }}/play-store-key.json
      FLUTTER_CMD: flutter
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4G -XX:MaxMetaspaceSize=2G --add-opens=java.base/java.lang.ref=ALL-UNNAMED"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build
          key: android-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            gate-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}-
            gate-${{ runner.os }}-
            android-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - uses: burrunan/gradle-cache-action@v3
        with:
          build-root-directory: ${{ github.workspace }}/android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/namma-wallet.keystore

      - name: Decode Play Store service account
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 --decode > play-store-key.json

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Set up Ruby for fastlane
        if: env.STAGE == 'beta'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"
          bundler-cache: true
          working-directory: android

      - name: Build AAB and upload to Play internal track
        if: env.STAGE == 'beta'
        working-directory: android
        run: bundle exec fastlane beta

      - name: Version APK artifact
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          mv build/app/outputs/flutter-apk/app-release.apk "namma-wallet-v${VERSION}.apk"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: namma-wallet-apk
          path: namma-wallet-v*.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: Build & Ship iOS
    runs-on: macos-latest-xlarge
    timeout-minutes: 90
    needs: [changes, gate]
    if: needs.changes.outputs.code == 'true'
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_PATH: ./AuthKey.p8
      FLUTTER_CMD: flutter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build
          key: ios-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            ios-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set up Ruby for fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.10"
          bundler-cache: true
          working-directory: ios

      - name: Decode App Store Connect API key
        run: echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode > ios/fastlane/AuthKey.p8

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build and upload to TestFlight
        if: env.STAGE == 'beta'
        working-directory: ios
        run: bundle exec fastlane beta

      - name: Build signed IPA only
        if: env.STAGE == 'release'
        working-directory: ios
        run: bundle exec fastlane build_ipa

      - name: Version IPA artifact
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          mv build/ios/ipa/*.ipa "namma-wallet-v${VERSION}.ipa"

      - name: Upload IPA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: namma-wallet-ipa
          path: namma-wallet-v*.ipa
          retention-days: 7
          if-no-files-found: error

  promote:
    name: Promote to Production
    if: ${{ !cancelled() && (github.event_name == 'pull_request' && github.base_ref == 'release') || (github.event_name == 'workflow_dispatch' && inputs.stage == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, android, ios, check-play-store]
    env:
      PLAY_STORE_JSON_PATH: ${{ github.workspace }}/play-store-key.json
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_PATH: ./AuthKey.p8
    steps:
      - uses: actions/checkout@v5

      - name: Decode Play Store service account
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 --decode > play-store-key.json

      - name: Decode App Store Connect API key
        run: echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode > ios/fastlane/AuthKey.p8

      - name: Set up Ruby for Android fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"
          bundler-cache: true
          working-directory: android

      - name: Promote Android build to Production
        if: needs.android.result == 'success'
        working-directory: android
        run: bundle exec fastlane production

      - name: Set up Ruby for iOS fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.10"
          bundler-cache: true
          working-directory: ios

      - name: Promote iOS build to App Store
        working-directory: ios
        run: bundle exec fastlane production

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, android, ios, promote]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && (needs.android.result == 'success' || needs.android.result == 'skipped') && needs.ios.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: namma-wallet-*
          merge-multiple: true
          path: dist

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          PRERELEASE="true"
          [ "$STAGE" = "release" ] && PRERELEASE="false"
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Attest APK provenance
        if: needs.android.result == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/namma-wallet-v*.apk

      - name: Attest IPA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/namma-wallet-v*.ipa

      - name: Prepare release notes
        run: cat ios/fastlane/metadata/en-US/release_notes.txt > release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Namma Wallet v${{ steps.meta.outputs.version }}
          body_path: release_body.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/namma-wallet-v*
          fail_on_unmatched_files: false

  ci-ok:
    name: CI Status
    if: always()
    needs: [changes, gate, check-play-store, android, ios, promote]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "gate: ${{ needs.gate.result }}"
          echo "check-play-store: ${{ needs.check-play-store.result }}"
          echo "android: ${{ needs.android.result }}"
          echo "ios: ${{ needs.ios.result }}"
          echo "promote: ${{ needs.promote.result }}"
          if [[ "${{ needs.gate.result }}" == "failure" || "${{ needs.android.result }}" == "failure" || "${{ needs.ios.result }}" == "failure" || "${{ needs.promote.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          if [[ "${{ needs.gate.result }}" == "cancelled" || "${{ needs.android.result }}" == "cancelled" || "${{ needs.ios.result }}" == "cancelled" ]]; then
            echo "One or more jobs was cancelled"
            exit 1
          fi
          echo "All checks passed or were skipped"
