name: Post PR Comments

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI", "greenlight", "Periphery (iOS Dead Code)"]
    types:
      - completed

permissions:
  pull-requests: write
  issues: write

jobs:
  post-comments:
    name: Post Comments to PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download PR Comments Artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          merge-multiple: true
          pattern: pr-comments-*
        continue-on-error: true

      - name: Post Comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const artifactsDir = 'artifacts';

            if (!fs.existsSync(artifactsDir)) {
              console.log('No artifacts found.');
              return;
            }

            // We know the PR number from workflow_run, but the artifact might contain it as a double check
            // For workflow_run on pull_request, we can extract PR number from pull_requests array
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests || pullRequests.length === 0) {
              console.log('No pull request found in workflow_run payload.');
              // Try to find it from artifacts
            }

            const trustedPrNumber = pullRequests && pullRequests.length > 0 ? pullRequests[0].number : null;

            const subdirs = fs.readdirSync(artifactsDir).filter(f => fs.statSync(path.join(artifactsDir, f)).isDirectory());
            // If merge-multiple is true, files might be directly in artifactsDir
            const hasFilesDirectly = fs.readdirSync(artifactsDir).some(f => fs.statSync(path.join(artifactsDir, f)).isFile());

            if (hasFilesDirectly) {
               subdirs.push(''); // Represent the root of artifactsDir
            }

            for (const subdir of subdirs) {
              const dirPath = path.join(artifactsDir, subdir);

              const prNumberPath = path.join(dirPath, 'pr_number');
              const artifactPrNumber = fs.existsSync(prNumberPath) ? parseInt(fs.readFileSync(prNumberPath, 'utf8').trim(), 10) : NaN;
              const prNumber = trustedPrNumber || artifactPrNumber;
              if (!prNumber || isNaN(prNumber)) {
                console.log(`No valid PR number found in ${subdir}`);
                continue;
              }

              console.log(`Processing comments for PR #${prNumber} from ${subdir}`);

              const findComment = async (includesText) => {
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100
                });
                return comments.data.find(c => 
                  c.user.login === 'github-actions[bot]' && c.body.includes(includesText)
                );
              };

              // 1. Format comment
              const formatCommentPath = path.join(dirPath, 'format_comment.txt');
              if (fs.existsSync(formatCommentPath)) {
                const body = fs.readFileSync(formatCommentPath, 'utf8').trim();
                const existing = await findComment('Formatting check failed');
                
                if (body === 'DELETE') {
                  if (existing) {
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                    });
                    console.log('Deleted format comment');
                  } else {
                    console.log('No format comment to delete');
                  }
                } else if (body) {
                  if (existing) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                      body: body,
                    });
                    console.log('Updated format comment');
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      body: body,
                    });
                    console.log('Created format comment');
                  }
                }
              }

              // 2. Build runner comment
              const buildRunnerCommentPath = path.join(dirPath, 'build_runner_comment.txt');
              if (fs.existsSync(buildRunnerCommentPath)) {
                const body = fs.readFileSync(buildRunnerCommentPath, 'utf8').trim();
                const existing = await findComment('Build runner') || await findComment('Generated files are missing');
                
                if (body === 'DELETE') {
                  if (existing) {
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                    });
                    console.log('Deleted build runner comment');
                  } else {
                    console.log('No build runner comment to delete');
                  }
                } else if (body) {
                  if (existing) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                      body: body,
                    });
                    console.log('Updated build runner comment');
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      body: body,
                    });
                    console.log('Created build runner comment');
                  }
                }
              }

              // 3. Analyze comment
              const analyzeCommentPath = path.join(dirPath, 'analyze_comment.txt');
              if (fs.existsSync(analyzeCommentPath)) {
                const body = fs.readFileSync(analyzeCommentPath, 'utf8').trim();
                const existing = await findComment('Flutter analysis');
                if (body === 'DELETE') {
                  if (existing) {
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                    });
                    console.log('Deleted analyze comment');
                  }
                } else if (body) {
                  if (existing) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                      body: body,
                    });
                    console.log('Updated analyze comment');
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      body: body,
                    });
                    console.log('Created analyze comment');
                  }
                }
              }

              // 4. Test comment
              const testCommentPath = path.join(dirPath, 'test_comment.txt');
              if (fs.existsSync(testCommentPath)) {
                const body = fs.readFileSync(testCommentPath, 'utf8').trim();
                const existing = await findComment('Test run failed');
                if (body === 'DELETE') {
                  if (existing) {
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                    });
                    console.log('Deleted test comment');
                  }
                } else if (body) {
                  if (existing) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                      body: body,
                    });
                    console.log('Updated test comment');
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      body: body,
                    });
                    console.log('Created test comment');
                  }
                }
              }

              // 5. Greenlight comment
              const greenlightCommentPath = path.join(dirPath, 'greenlight_comment.txt');
              if (fs.existsSync(greenlightCommentPath)) {
                const body = fs.readFileSync(greenlightCommentPath, 'utf8').trim();
                const existing = await findComment('Greenlight preflight');
                if (body === 'DELETE') {
                  if (existing) {
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                    });
                    console.log('Deleted greenlight comment');
                  }
                } else if (body) {
                  if (existing) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                      body: body,
                    });
                    console.log('Updated greenlight comment');
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      body: body,
                    });
                    console.log('Created greenlight comment');
                  }
                }
              }

              // 6. Periphery comment
              const peripheryCommentPath = path.join(dirPath, 'periphery_comment.txt');
              if (fs.existsSync(peripheryCommentPath)) {
                const body = fs.readFileSync(peripheryCommentPath, 'utf8').trim();
                if (body) {
                  const existing = await findComment('Periphery Swift Dead Code');
                  if (existing) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existing.id,
                      body: body,
                    });
                    console.log('Updated periphery comment');
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      body: body,
                    });
                    console.log('Created periphery comment');
                  }
                }
              }
            }
