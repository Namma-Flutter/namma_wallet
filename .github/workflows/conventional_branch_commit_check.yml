name: Conventional Commits & Branch Naming

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot') && github.actor != 'imgbot[bot]' && github.actor != 'ImgBotApp' && !startsWith(github.head_ref, 'imgbot')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"

          # Allowed:
          #   main | master | develop
          #   feature/<slug> | feat/<slug>
          #   bugfix/<slug>  | fix/<slug>
          #   hotfix/<slug>
          #   release/<slug>
          #   chore/<slug>
          #
          # slug = lowercase letters, numbers, dots, underscores, dashes

          if [[ ! "$BRANCH" =~ ^((main|master|develop)|((feature|feat|bugfix|fix|hotfix|release|chore)\/[a-z0-9._-]+))$ ]]; then
            echo "::error title=Invalid branch name::'$BRANCH' does not follow required naming rules."
            echo "Allowed formats:"
            echo "  main | master | develop"
            echo "  feature/<slug> | feat/<slug>"
            echo "  bugfix/<slug>  | fix/<slug>"
            echo "  hotfix/<slug>"
            echo "  release/<slug>"
            echo "  chore/<slug>"
            exit 1
          fi

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot') && github.actor != 'imgbot[bot]' && github.actor != 'ImgBotApp' && !startsWith(github.head_ref, 'imgbot')
    needs: branch-name
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: webiny/action-conventional-commits@8bc41ff4e7d423d56fa4905f6ff79209a78776c7 # v1.3.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          allowed-commit-types: "feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert"
