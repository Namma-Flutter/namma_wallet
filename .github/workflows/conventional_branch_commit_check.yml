name: Conventional Commits & Branch Naming

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate
        env:
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$ACTOR" == "dependabot[bot]" || "$BRANCH" =~ ^dependabot\/ || "$ACTOR" == "imgbot[bot]" || "$ACTOR" == "ImgBotApp" || "$BRANCH" =~ ^imgbot\/ ]]; then
            echo "Skipping branch name validation for bot: $ACTOR ($BRANCH)"
            exit 0
          fi

          echo "Branch: $BRANCH"

          # Allowed:
          #   main | master | develop
          #   feature/<slug> | feat/<slug>
          #   bugfix/<slug>  | fix/<slug>
          #   hotfix/<slug>
          #   release/<slug>
          #   chore/<slug>
          #
          # slug = lowercase letters, numbers, dots, underscores, dashes

          if [[ ! "$BRANCH" =~ ^((main|master|develop)|((feature|feat|bugfix|fix|hotfix|release|chore)\/[a-z0-9._-]+))$ ]]; then
            echo "::error title=Invalid branch name::'$BRANCH' does not follow required naming rules."
            echo "Allowed formats:"
            echo "  main | master | develop"
            echo "  feature/<slug> | feat/<slug>"
            echo "  bugfix/<slug>  | fix/<slug>"
            echo "  hotfix/<slug>"
            echo "  release/<slug>"
            echo "  chore/<slug>"
            exit 1
          fi

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: branch-name
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check if bot PR
        id: bot_check
        env:
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$ACTOR" == "dependabot[bot]" || "$BRANCH" =~ ^dependabot\/ || "$ACTOR" == "imgbot[bot]" || "$ACTOR" == "ImgBotApp" || "$BRANCH" =~ ^imgbot\/ ]]; then
            echo "is_bot=true" >> "$GITHUB_OUTPUT"
            echo "Skipping commit linting for bot: $ACTOR"
          else
            echo "is_bot=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.bot_check.outputs.is_bot != 'true'

      - uses: webiny/action-conventional-commits@8bc41ff4e7d423d56fa4905f6ff79209a78776c7 # v1.3.0
        if: steps.bot_check.outputs.is_bot != 'true'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          allowed-commit-types: "feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert"
