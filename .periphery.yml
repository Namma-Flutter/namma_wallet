# Periphery configuration for Namma Wallet (iOS Swift)
# https://github.com/peripheryapp/periphery

workspace: ios/Runner.xcworkspace
schemes:
  - Runner
targets:
  - Runner
  - Share Extension
  - TicketWidgetExtension

build_arguments:
  - "-destination"
  - "generic/platform=iOS"
  - "-sdk"
  - "iphoneos"
  - "CODE_SIGNING_ALLOWED=NO"
  - "CODE_SIGNING_REQUIRED=NO"

# Retain declarations needed by Flutter and Objective-C bridge
retain_objc_accessible: true
retain_unused_protocol_func_params: true

# Exclude CocoaPods, Flutter engine, and generated plugin code
report_exclude:
  - "**/Pods/**"
  - "**/.symlinks/**"
  - "**/Flutter/**"
  - "ios/Flutter/**"
  - "ios/Pods/**"
  - "**/GeneratedPluginRegistrant.*"
